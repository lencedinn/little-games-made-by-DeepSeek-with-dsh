<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#080a12" />
<title>双轨 · TWINRAIL</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    margin:0;height:100%;overflow:hidden;background:#080a12;color:#dfe9f4;
    font-family:"PingFang SC","Microsoft YaHei",-apple-system,"Segoe UI",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;overscroll-behavior:none;
  }
  #cv{display:block;position:fixed;inset:0;touch-action:none;cursor:pointer}
  #ov{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;
    background:radial-gradient(circle at 50% 40%,rgba(12,16,26,.55),rgba(4,5,10,.94));
    opacity:0;visibility:hidden;pointer-events:none;transition:opacity .28s,visibility 0s .28s;padding:22px;
  }
  #ov.show{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .28s,visibility 0s 0s}
  #panel{width:100%;max-width:440px;text-align:center}
  #panel h1{
    margin:0 0 6px;font-size:44px;font-weight:900;letter-spacing:.16em;line-height:1.05;
    background:linear-gradient(100deg,#7ef0d0,#ffd98a 62%,#ff8ab0);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 22px rgba(126,240,208,.35));
  }
  #panel .sub{font-size:10px;letter-spacing:.5em;color:#4b6076;margin-bottom:20px}
  #panel p{font-size:13px;line-height:2;color:#93a8bd;margin:0 0 18px}
  #panel kbd{
    display:inline-block;padding:1px 8px;border-radius:5px;font-family:inherit;
    background:rgba(126,240,208,.12);border:1px solid rgba(126,240,208,.3);color:#bff6e6;font-size:12px;
  }
  .btn{
    display:inline-block;padding:14px 44px;border-radius:12px;border:0;cursor:pointer;font-family:inherit;
    font-size:14px;font-weight:800;letter-spacing:.3em;text-indent:.3em;color:#04140f;
    background:linear-gradient(100deg,#7ef0d0,#8ad8ff);box-shadow:0 8px 30px rgba(126,240,208,.28);
    transition:transform .1s;
  }
  .btn:active{transform:translateY(2px)}
  .big{font-size:56px;font-weight:900;color:#eafcff;line-height:1;margin:6px 0 4px;
    text-shadow:0 0 34px rgba(126,240,208,.5);font-variant-numeric:tabular-nums}
  .unit{font-size:12px;letter-spacing:.24em;color:#5d7488;margin-bottom:16px}
  #lang{
    position:fixed;left:8px;top:50%;transform:translateY(-50%);z-index:999;
    padding:6px 7px;border-radius:7px;cursor:pointer;font:700 10px/1 system-ui,sans-serif;
    letter-spacing:.04em;opacity:.55;transition:opacity .2s;
    color:#dfe9f2;background:rgba(16,18,26,.75);border:1px solid rgba(180,200,220,.3);
  }
  #lang:hover{opacity:1}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="ov" class="show"><div id="panel"></div></div>
<button id="lang"></button>

<script>
(function () {
  'use strict';

  /* ================================================================== *
   *  双轨 · TWINRAIL
   *  两根轨道，一个动作：换轨。
   *  挡住的那根换一根；断掉的那根也换一根。
   * ================================================================== */

  var STR = {
    zh: {
      title: '双轨', sub: 'T W I N R A I L',
      p1: '你在两根轨道之间奔跑，停不下来。',
      p2: '<kbd>空格</kbd> / <kbd>点击</kbd>　换轨',
      p3: '挡住的那根换一根；中间断开的那根，也换一根。',
      p4: '撞上、或者掉下去，就结束了。',
      start: '开 始', again: '再 来 一 次', over: '结 束 了',
      dist: '距离', best: '最远', newbest: '★ 新 纪 录 ★',
      hint: '空格 重开', m: '米',
      tip: '空格 / 点击　换轨',
      causeBlock: '撞上了障碍', causeFall: '掉进了断口',
      paused: '暂 停', pausedTip: '按 P 继续', resume: '继 续'
    },
    en: {
      title: 'TWINRAIL', sub: 'T W I N   R A I L',
      p1: 'You run on two rails. You cannot stop.',
      p2: '<kbd>Space</kbd> / <kbd>click</kbd>　switch rail',
      p3: 'Blocked rail? Switch. Broken rail? Switch too.',
      p4: 'Hit something, or fall through — run over.',
      start: 'START', again: 'RUN AGAIN', over: 'RUN ENDED',
      dist: 'DISTANCE', best: 'BEST', newbest: '★ NEW RECORD ★',
      hint: 'Space to restart', m: 'm',
      tip: 'Space / click  to switch rail',
      causeBlock: 'Hit an obstacle', causeFall: 'Fell through the gap',
      paused: 'PAUSED', pausedTip: 'Press P to resume', resume: 'RESUME'
    }
  };

  var LANG = 'zh';
  try {
    var sv = localStorage.getItem('twinrailLang');
    if (sv) LANG = sv;
    else if ((navigator.language || 'zh').toLowerCase().indexOf('zh') !== 0) LANG = 'en';
  } catch (e) {
    if ((navigator.language || 'zh').toLowerCase().indexOf('zh') !== 0) LANG = 'en';
  }
  function t(k) { return (STR[LANG] && STR[LANG][k]) || STR.zh[k] || ''; }

  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1;
  var LOW = 0, HIGH = 0, PH = 22, PX = 200;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    cv.width = Math.round(W * DPR);
    cv.height = Math.round(H * DPR);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    layout();
  }

  function layout() {
    var gap = Math.max(170, Math.min(H * 0.42, 330));
    LOW = Math.round(H / 2 + gap / 2);
    HIGH = Math.round(H / 2 - gap / 2);
  }

  var SPEED0 = 430, SPEED_MAX = 980;
  var SWITCH_T = 0.19;
  var SWITCH_CD = 0.09;
  var BLOCK_W = 34, BLOCK_H = 26;
  var HIT_W = 8;         /* 判定半宽，比方块 11 略小 */

  var S = {
    state: 'menu', t: 0, cam: 0, speed: SPEED0,
    lane: 1, from: 1, to: 1, laneT: 1, cd: 0,
    py: 0, dist: 0, best: 0,
    blocks: [], gapsLow: [], gapsHigh: [], coins: [], floats: [],
    genX: 0, coinN: 0, coinTotal: 0, mile: 0, hintT: 0,
    shake: 0, flash: 0, deadT: 0, cause: '', trail: []
  };

  var PREF_BGM = true;
  try {
    var bb = parseFloat(localStorage.getItem('twinrailBest') || '0');
    if (isFinite(bb)) S.best = bb;
    if (localStorage.getItem('twinrailBgm') === '0') PREF_BGM = false;
  } catch (e) { }

  function laneY(l) { return l === 0 ? HIGH : LOW; }
  function playerY() {
    var a = laneY(S.from), b = laneY(S.to);
    var k = S.laneT * S.laneT * (3 - 2 * S.laneT);   /* smoothstep */
    return a + (b - a) * k;
  }

  /* ------------------------------ 生成 ------------------------------ */

  function addBlock(x, lane) { S.blocks.push({ x: x, lane: lane }); }
  function addGap(x0, x1, lane) {
    if (lane === 0) S.gapsHigh.push({ x0: x0, x1: x1 });
    else S.gapsLow.push({ x0: x0, x1: x1 });
  }
  function addCoin(x, y) {
    S.coins.push({ x: x, y: y, got: false, t: Math.random() * 6.28 });
    S.coinTotal++;
  }

  function genChunk() {
    var base = S.genX;
    var diff = Math.min(1, S.dist / 900);
    var spd = Math.max(SPEED0, S.speed);
    var spacing = spd * (0.74 - diff * 0.18);
    var lane = Math.random() < 0.5 ? 0 : 1;
    var kind = Math.random();

    if (kind < 0.58) {
      addBlock(base, lane);
      /* 金币摆在"被挡住的那条轨"上：想拿，就得晚一点再换走 */
      if (Math.random() < 0.75) addCoin(base - 250, laneY(lane) - PH / 2);
      if (Math.random() < 0.45) addCoin(base - 180, laneY(lane) - PH / 2);
      S.genX = base + spacing;
    } else if (kind < 0.86) {
      var gw = 90 + Math.random() * 90;
      addGap(base, base + gw, lane);
      if (Math.random() < 0.4) addCoin(base - 200, laneY(lane) - PH / 2);
      S.genX = base + gw + spacing * 0.85;
    } else {
      var l1 = lane;
      var half = Math.max(spacing * 0.55, spd * 0.55);
      addBlock(base, l1);
      addBlock(base + half, 1 - l1);
      if (Math.random() < 0.5) addCoin(base - 220, laneY(l1) - PH / 2);
      S.genX = base + half + spacing;
    }
  }

  function ensureWorld() {
    while (S.genX < S.cam + W * 2.4) genChunk();
    var cut = S.cam - 220;
    S.blocks = S.blocks.filter(function (b) { return b.x + BLOCK_W > cut; });
    S.gapsLow = S.gapsLow.filter(function (g) { return g.x1 > cut; });
    S.gapsHigh = S.gapsHigh.filter(function (g) { return g.x1 > cut; });
    S.coins = S.coins.filter(function (c) { return c.x > cut && !c.got; });
  }

  function inGap(list, x) {
    for (var i = 0; i < list.length; i++) if (x > list[i].x0 && x < list[i].x1) return true;
    return false;
  }

  function reset() {
    S.state = 'playing';
    S.t = 0; S.cam = 0; S.speed = SPEED0;
    S.lane = 1; S.from = 1; S.to = 1; S.laneT = 1; S.cd = 0;
    S.dist = 0; S.blocks = []; S.gapsLow = []; S.gapsHigh = []; S.coins = [];
    S.floats = []; S.coinN = 0; S.coinTotal = 0; S.mile = 0; S.hintT = 3;
    S.shake = 0; S.flash = 0; S.deadT = 0; S.cause = '';
    S.trail = []; S.genX = 950;
    genChunk();
    ensureWorld();
    S.py = playerY();
  }

  function switchLane() {
    if (S.state !== 'playing' || S.cd > 0) return;
    S.from = S.lane;
    S.lane = 1 - S.lane;
    S.to = S.lane;
    S.laneT = 0;
    S.cd = SWITCH_T + 0.06;
    sfx('switch');
  }

  function kill(cause) {
    if (S.state !== 'playing') return;
    S.state = 'dead';
    S.cause = cause;
    S.shake = 1; S.flash = 0.7;
    sfx('die');
    bgmStop();
    if (S.dist > S.best) {
      S.best = S.dist;
      try { localStorage.setItem('twinrailBest', String(Math.round(S.best))); } catch (e) { }
      S.newBest = true;
    } else S.newBest = false;
    setTimeout(showOver, 420);
  }

  function update(dt) {
    if (S.state === 'paused') return;
    S.t += dt;
    if (S.hintT > 0) S.hintT -= dt;
    if (S.cd > 0) S.cd -= dt;
    S.flash = Math.max(0, S.flash - dt * 3);
    S.shake = Math.max(0, S.shake - dt * 2.6);

    for (var fi = S.floats.length - 1; fi >= 0; fi--) {
      S.floats[fi].life += dt;
      if (S.floats[fi].life > 1.1) S.floats.splice(fi, 1);
    }

    if (S.state === 'dead') {
      S.deadT += dt;
      if (S.cause === 'fall') S.py += 620 * dt;
      return;
    }
    if (S.state !== 'playing') return;

    if (S.laneT < 1) S.laneT = Math.min(1, S.laneT + dt / SWITCH_T);
    S.py = playerY();

    S.speed = Math.min(SPEED_MAX, SPEED0 + S.dist * 1.05);
    S.cam += S.speed * dt;
    S.dist = S.cam / 50;

    var mileNow = Math.floor(S.dist / 100);
    if (mileNow > S.mile) {
      S.mile = mileNow;
      S.floats.push({ text: (mileNow * 100) + ' ' + t('m'), life: 0, x: W * 0.5, y: H * 0.32 });
      sfx('mile');
    }

    ensureWorld();

    var wx = S.cam + PX;

    /* 离开轨道之后就不在任何一条轨道上：两条都安全
       落回轨道才算到站 */
    var activeLane = -1;
    if (S.laneT >= 1) activeLane = S.lane;          /* 停在轨道上 */
    else if (S.laneT <= 0.02) activeLane = S.from;  /* 刚按下、还没离开 */

    if (activeLane >= 0) {
      var gl = activeLane === 0 ? S.gapsHigh : S.gapsLow;
      if (inGap(gl, wx)) { kill('fall'); return; }

      for (var i = 0; i < S.blocks.length; i++) {
        var b = S.blocks[i];
        if (b.lane !== activeLane) continue;
        if (wx + HIT_W > b.x && wx - HIT_W < b.x + BLOCK_W) { kill('block'); return; }
      }
    }

    var pcy = S.py - PH / 2;
    for (var ci = S.coins.length - 1; ci >= 0; ci--) {
      var co = S.coins[ci];
      if (co.got) continue;
      var dx = co.x - wx, dy = co.y - pcy;
      if (dx * dx + dy * dy < 28 * 28) {
        co.got = true;
        S.coinN++;
        sfx('coin');
      }
    }

    S.trail.push({ y: S.py, life: 0 });
    if (S.trail.length > 12) S.trail.shift();
    for (var k = 0; k < S.trail.length; k++) S.trail[k].life += dt;
  }

  /* ------------------------------ 渲染 ------------------------------ */

  var stars = [];
  function initStars() {
    stars = [];
    var n = Math.round(Math.min(140, W * H / 10000));
    for (var i = 0; i < n; i++) stars.push({ x: Math.random() * W, y: Math.random() * H, z: Math.random(), s: Math.random() * 1.5 + 0.4 });
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function mixHex(a, b, k) {
    var pa = [parseInt(a.slice(1, 3), 16), parseInt(a.slice(3, 5), 16), parseInt(a.slice(5, 7), 16)];
    var pb = [parseInt(b.slice(1, 3), 16), parseInt(b.slice(3, 5), 16), parseInt(b.slice(5, 7), 16)];
    var o = '#';
    for (var i = 0; i < 3; i++) {
      var v = Math.round(pa[i] + (pb[i] - pa[i]) * k);
      o += (v < 16 ? '0' : '') + v.toString(16);
    }
    return o;
  }

  function render() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    var biome = Math.min(1, S.dist / 1500);
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, mixHex('#070a12', '#0a0818', biome));
    g.addColorStop(0.5, mixHex('#0a1020', '#151029', biome));
    g.addColorStop(1, mixHex('#120a18', '#1b102c', biome));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    for (var i = 0; i < stars.length; i++) {
      var st = stars[i];
      var sx = ((st.x - S.cam * (0.05 + st.z * 0.16)) % W + W) % W;
      ctx.globalAlpha = 0.22 + st.z * 0.5;
      ctx.fillStyle = st.z > 0.7 ? '#9fe9ff' : '#7f93b8';
      ctx.fillRect(sx, st.y, st.s, st.s * (1 + st.z * 1.3));
    }
    ctx.globalAlpha = 1;

    var sh = S.shake * 12;
    if (sh > 0.2) ctx.translate((Math.random() - 0.5) * sh, (Math.random() - 0.5) * sh);

    drawRail(LOW, '#7ef0d0', S.gapsLow);
    drawRail(HIGH, '#ffd98a', S.gapsHigh);
    drawBlocks();
    drawCoins();
    drawTrail();
    drawPlayer();
    drawFloats();

    if (S.flash > 0) {
      ctx.fillStyle = 'rgba(126,240,208,' + (S.flash * 0.2).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }
    drawHUD();
  }

  function drawRail(y, color, gaps) {
    ctx.save();
    ctx.strokeStyle = color;
    ctx.lineWidth = 4;
    ctx.shadowColor = color;
    ctx.shadowBlur = 16;
    ctx.beginPath();
    var i, x0, x1;
    ctx.moveTo(-20, y);
    for (i = 0; i < gaps.length; i++) {
      x0 = gaps[i].x0 - S.cam;
      x1 = gaps[i].x1 - S.cam;
      if (x1 < -30) continue;
      ctx.lineTo(x0, y);
      ctx.moveTo(x1, y);
    }
    ctx.lineTo(W + 20, y);
    ctx.stroke();

    ctx.shadowBlur = 0;
    ctx.globalAlpha = 0.22;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-20, y + 6);
    for (i = 0; i < gaps.length; i++) {
      x0 = gaps[i].x0 - S.cam;
      x1 = gaps[i].x1 - S.cam;
      if (x1 < -30) continue;
      ctx.lineTo(x0, y + 6);
      ctx.moveTo(x1, y + 6);
    }
    ctx.lineTo(W + 20, y + 6);
    ctx.stroke();
    ctx.restore();
  }

  function drawBlocks() {
    for (var i = 0; i < S.blocks.length; i++) {
      var b = S.blocks[i];
      var x = b.x - S.cam;
      if (x + BLOCK_W < -40 || x > W + 40) continue;
      var y = laneY(b.lane) - BLOCK_H;
      ctx.save();
      ctx.shadowColor = '#ff6b8a';
      ctx.shadowBlur = 16;
      ctx.fillStyle = '#ff6b8a';
      roundRect(x, y + 2, BLOCK_W, BLOCK_H - 2, 5);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(20,8,14,.55)';
      roundRect(x + 6, y + 8, BLOCK_W - 12, BLOCK_H - 14, 3);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawCoins() {
    for (var i = 0; i < S.coins.length; i++) {
      var c = S.coins[i];
      if (c.got) continue;
      var x = c.x - S.cam;
      if (x < -40 || x > W + 40) continue;
      var bob = Math.sin(S.t * 4 + c.t) * 3;
      ctx.save();
      ctx.shadowColor = '#ffd98a';
      ctx.shadowBlur = 14;
      ctx.fillStyle = '#ffe6a8';
      ctx.beginPath();
      ctx.arc(x, c.y + bob, 7, 0, 6.2832);
      ctx.fill();
      ctx.fillStyle = '#b98820';
      ctx.beginPath();
      ctx.arc(x, c.y + bob, 3.2, 0, 6.2832);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawTrail() {
    for (var i = 0; i < S.trail.length; i++) {
      ctx.globalAlpha = (1 - i / S.trail.length) * 0.3;
      ctx.fillStyle = '#7ef0d0';
      roundRect(PX - 8 + (i - S.trail.length) * 1.2, S.trail[i].y - 9, 16, 18, 5);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawPlayer() {
    if (S.state === 'menu') return;
    var dead = S.state === 'dead';
    var y = S.py, x = PX;
    ctx.save();
    ctx.shadowColor = dead ? '#ff6b8a' : '#7ef0d0';
    ctx.shadowBlur = dead ? 26 : 20;
    var pg = ctx.createLinearGradient(x - PH / 2, y - PH, x + PH / 2, y);
    pg.addColorStop(0, dead ? '#ff9db0' : '#c8fff0');
    pg.addColorStop(1, dead ? '#ff5d7a' : '#4fd8b8');
    ctx.fillStyle = pg;
    roundRect(x - PH / 2, y - PH, PH, PH, 6);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#062018';
    ctx.beginPath();
    ctx.arc(x + 4, y - PH / 2, 2.6, 0, 6.2832);
    ctx.fill();
    ctx.restore();
  }

  function drawFloats() {
    for (var i = 0; i < S.floats.length; i++) {
      var f = S.floats[i];
      var k = f.life / 1.1;
      ctx.globalAlpha = (1 - k) * 0.9;
      ctx.textAlign = 'center';
      ctx.font = '900 30px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';
      ctx.fillStyle = '#7ef0d0';
      ctx.fillText(f.text, f.x, f.y - k * 40);
      ctx.globalAlpha = 1;
    }
  }

  function drawHUD() {
    if (S.state === 'menu') return;
    ctx.save();
    ctx.font = '800 12px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';
    ctx.fillStyle = 'rgba(147,168,189,.75)';
    ctx.textAlign = 'left';
    ctx.fillText(t('dist').toUpperCase(), 22, 32);
    ctx.font = '900 32px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';
    ctx.fillStyle = '#eafcff';
    ctx.fillText(Math.round(S.dist) + '', 22, 62);

    ctx.textAlign = 'right';
    ctx.font = '800 11px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';
    ctx.fillStyle = 'rgba(147,168,189,.6)';
    ctx.fillText(t('best').toUpperCase() + ' ' + Math.round(S.best), W - 22, 32);
    ctx.font = '900 20px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';
    ctx.fillStyle = '#ffd98a';
    ctx.fillText('◉ ' + S.coinN, W - 22, 60);

    if (S.hintT > 0) {
      ctx.globalAlpha = Math.min(1, S.hintT / 1.1);
      ctx.textAlign = 'center';
      ctx.font = '800 14px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';
      ctx.fillStyle = '#93a8bd';
      ctx.fillText(t('tip'), W / 2, H * 0.5);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  /* ------------------------------ 界面 ------------------------------ */

  var ov = document.getElementById('ov');
  var panel = document.getElementById('panel');

  function showMenu() {
    S.state = 'menu';
    panel.innerHTML =
      '<h1>' + t('title') + '</h1>' +
      '<div class="sub">' + t('sub') + '</div>' +
      '<p>' + t('p1') + '<br>' + t('p2') + '<br>' + t('p3') + '<br>' + t('p4') + '</p>' +
      '<button class="btn" id="btnStart">' + t('start') + '</button>';
    ov.classList.add('show');
    document.getElementById('btnStart').onclick = start;
    render();
  }

  function rankOf(d) {
    if (d >= 1200) return { r: 'S', c: '#ffd98a' };
    if (d >= 700) return { r: 'A', c: '#7ef0d0' };
    if (d >= 350) return { r: 'B', c: '#8ad8ff' };
    return { r: 'C', c: '#93a8bd' };
  }

  function showOver() {
    panel.innerHTML =
      '<h1>' + t('over') + '</h1>' +
      '<div class="big">' + Math.round(S.dist) + '</div>' +
      '<div class="unit">' + t('dist').toUpperCase() + '　·　◉ ' + S.coinN + '</div>' +
      '<div style="font-size:40px;font-weight:900;line-height:1;margin:0 0 8px;color:' + rankOf(S.dist).c + '">' + rankOf(S.dist).r + '</div>' +
      (S.newBest ? '<p style="color:#7ef0d0;margin-bottom:6px">' + t('newbest') + '</p>'
        : '<p style="margin-bottom:6px">' + t('best') + ' ' + Math.round(S.best) + '</p>') +
      '<p style="font-size:12px;color:#7a8a9d;margin-bottom:14px">' + t(S.cause === 'fall' ? 'causeFall' : 'causeBlock') + '</p>' +
      '<button class="btn" id="btnAgain">' + t('again') + '</button>' +
      '<p style="margin-top:14px;font-size:11px;color:#4b6076">' + t('hint') + '</p>';
    ov.classList.add('show');
    document.getElementById('btnAgain').onclick = start;
  }

  function start() {
    ov.classList.remove('show');
    initAudio();
    if (AC && AC.state === 'suspended') AC.resume();
    reset();
    initStars();
    bgmStart();
  }

  function togglePause() {
    if (S.state === 'playing') {
      S.state = 'paused';
      bgmStop();
      panel.innerHTML = '<h1>' + t('paused') + '</h1><p>' + t('pausedTip') + '</p>' +
        '<button class="btn" id="btnResume">' + t('resume') + '</button>';
      ov.classList.add('show');
      document.getElementById('btnResume').onclick = function () {
        ov.classList.remove('show');
        S.state = 'playing';
        bgmStart();
      };
    } else if (S.state === 'paused') {
      ov.classList.remove('show');
      S.state = 'playing';
      bgmStart();
    }
  }

  /* ------------------------------ 音频 ------------------------------ */

  var AC = null, MASTER = null, NOISE = null;
  function initAudio() {
    if (AC) return;
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    AC = new C();
    MASTER = AC.createGain();
    MASTER.gain.value = 0.36;
    MASTER.connect(AC.destination);
    NOISE = AC.createBuffer(1, Math.floor(AC.sampleRate * 2), AC.sampleRate);
    var nd = NOISE.getChannelData(0);
    for (var ni = 0; ni < nd.length; ni++) nd[ni] = Math.random() * 2 - 1;
  }

  function blip(f0, f1, dur, type, vol) {
    if (!AC) return;
    var tn = AC.currentTime;
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'triangle';
    o.frequency.setValueAtTime(f0, tn);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), tn + dur);
    g.gain.setValueAtTime(0.0001, tn);
    g.gain.exponentialRampToValueAtTime(vol || 0.12, tn + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, tn + dur);
    o.connect(g); g.connect(MASTER);
    o.start(tn); o.stop(tn + dur + 0.02);
  }

  function sfx(kind) {
    if (!AC) return;
    if (kind === 'switch') blip(520, 900, 0.09, 'triangle', 0.08);
    else if (kind === 'die') blip(300, 60, 0.5, 'sawtooth', 0.16);
    else if (kind === 'mile') blip(880, 1320, 0.16, 'sine', 0.09);
    else if (kind === 'coin') blip(1180, 1760, 0.07, 'square', 0.05);
  }

  var BGM = { on: PREF_BGM, timer: null, next: 0, step: 0 };

  function mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); }

  function bgmStart() {
    if (!AC || BGM.timer || !BGM.on) return;
    BGM.next = AC.currentTime + 0.1;
    BGM.step = 0;
    BGM.timer = setInterval(bgmTick, 45);
  }
  function bgmStop() { if (BGM.timer) { clearInterval(BGM.timer); BGM.timer = null; } }

  function bgmTick() {
    if (!AC || !BGM.on) return;
    var ahead = AC.currentTime + 0.2;
    var guard = 0;
    while (BGM.next < ahead && guard++ < 24) {
      var spd = (S.state === 'playing') ? S.speed : SPEED0;
      var bpm = 106 + Math.min(1, Math.max(0, (spd - SPEED0) / 550)) * 26;
      bgmStep(BGM.step, BGM.next, spd);
      BGM.next += 60 / bpm / 4;
      BGM.step++;
    }
  }

  var CHORDS = [
    { root: 45, third: 48, fifth: 52 },   /* Am */
    { root: 41, third: 45, fifth: 48 },   /* F  */
    { root: 48, third: 52, fifth: 55 },   /* C  */
    { root: 43, third: 47, fifth: 50 }    /* G  */
  ];

  function bgmStep(i, t2, spd) {
    var s16 = i % 16;
    var bar = Math.floor(i / 16) % 4;
    var ch = CHORDS[bar];
    var fast = spd > 700;

    /* 鼓：底鼓四拍，军鼓二三拍 */
    if (s16 === 0 || s16 === 4 || s16 === 8 || s16 === 12) kick(t2, s16 === 0 ? 0.15 : 0.12);
    if (s16 === 4 || s16 === 12) snare(t2);

    /* 贝斯：只走根音，稳一点 */
    if (s16 === 0) bassNote(t2, ch.root, 0.34);
    if (s16 === 6) bassNote(t2, ch.root, 0.2);
    if (s16 === 10) bassNote(t2, ch.fifth - 12, 0.22);

    /* 铺底：每小节一次和弦，慢慢进 */
    if (s16 === 0) pad(t2, ch);

    /* 琶音：八分音符，跟着和弦走 */
    if (s16 === 2 || s16 === 6 || s16 === 10 || s16 === 14) {
      var tone = [ch.root + 12, ch.third + 12, ch.fifth + 12, ch.third + 24][s16 / 4 | 0];
      arp(t2, tone, fast);
    }

    /* 镲：八分，不刺 */
    if (s16 === 0 || s16 === 8) hat(t2, 0.018);
    else if (s16 === 4 || s16 === 12) hat(t2, 0.026);

    /* 第四小节加一个过门 */
    if (bar === 3 && s16 === 14) fill(t2, ch);
  }

  function kick(t2, vol) {
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(150, t2);
    o.frequency.exponentialRampToValueAtTime(52, t2 + 0.09);
    g.gain.setValueAtTime(vol, t2);
    g.gain.exponentialRampToValueAtTime(0.0001, t2 + 0.16);
    o.connect(g); g.connect(MASTER);
    o.start(t2); o.stop(t2 + 0.18);
  }

  function snare(t2) {
    if (!NOISE) return;
    var src = AC.createBufferSource();
    src.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = 1900; f.Q.value = 1.2;
    var g = AC.createGain();
    g.gain.setValueAtTime(0.055, t2);
    g.gain.exponentialRampToValueAtTime(0.0001, t2 + 0.11);
    src.connect(f); f.connect(g); g.connect(MASTER);
    src.start(t2, 0, 0.12);
  }

  function hat(t2, vol) {
    if (!NOISE) return;
    var src = AC.createBufferSource();
    src.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = 'highpass'; f.frequency.value = 5200;
    var g = AC.createGain();
    g.gain.setValueAtTime(vol, t2);
    g.gain.exponentialRampToValueAtTime(0.0001, t2 + 0.04);
    src.connect(f); f.connect(g); g.connect(MASTER);
    src.start(t2, 0, 0.05);
  }

  function bassNote(t2, root, dur) {
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = 'triangle';
    o.frequency.value = mtof(root - 12);
    var f = AC.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 620; f.Q.value = 2;
    g.gain.setValueAtTime(0.0001, t2);
    g.gain.exponentialRampToValueAtTime(0.085, t2 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t2 + dur);
    o.connect(f); f.connect(g); g.connect(MASTER);
    o.start(t2); o.stop(t2 + dur + 0.02);
  }

  function pad(t2, ch) {
    var tones = [ch.root, ch.third, ch.fifth];
    for (var k = 0; k < tones.length; k++) {
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sine';
      o.frequency.value = mtof(tones[k]);
      o.detune.value = (k - 1) * 4;
      g.gain.setValueAtTime(0.0001, t2);
      g.gain.exponentialRampToValueAtTime(0.020, t2 + 0.5);
      g.gain.exponentialRampToValueAtTime(0.0001, t2 + 2.2);
      o.connect(g); g.connect(MASTER);
      o.start(t2); o.stop(t2 + 2.3);
    }
  }

  function arp(t2, midi, bright) {
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = bright ? 'square' : 'triangle';
    o.frequency.value = mtof(midi + 12);
    g.gain.setValueAtTime(0.0001, t2);
    g.gain.exponentialRampToValueAtTime(bright ? 0.016 : 0.024, t2 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t2 + 0.2);
    o.connect(g); g.connect(MASTER);
    o.start(t2); o.stop(t2 + 0.22);
  }

  function fill(t2, ch) {
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(mtof(ch.fifth + 12), t2);
    o.frequency.exponentialRampToValueAtTime(mtof(ch.fifth + 24), t2 + 0.12);
    g.gain.setValueAtTime(0.0001, t2);
    g.gain.exponentialRampToValueAtTime(0.03, t2 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t2 + 0.22);
    o.connect(g); g.connect(MASTER);
    o.start(t2); o.stop(t2 + 0.24);
  }
  /* ------------------------------ 输入 ------------------------------ */

  function act() {
    initAudio();
    if (AC && AC.state === 'suspended') AC.resume();
    if (S.state === 'menu') { start(); return; }
    if (S.state === 'dead') { if (S.deadT > 0.55) start(); return; }
    switchLane();
  }

  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.key === ' ' || e.key === 'Enter') { e.preventDefault(); act(); return; }
    if (e.key === 'p' || e.key === 'P') { e.preventDefault(); togglePause(); return; }
    if (e.key === 'r' || e.key === 'R') { e.preventDefault(); if (S.state !== 'menu') start(); return; }
    if (e.key === 'm' || e.key === 'M') {
      BGM.on = !BGM.on;
      try { localStorage.setItem('twinrailBgm', BGM.on ? '1' : '0'); } catch (err) { }
      if (BGM.on) bgmStart(); else bgmStop();
      return;
    }
  });

  cv.addEventListener('pointerdown', function (e) { e.preventDefault(); act(); });
  cv.addEventListener('touchstart', function (e) { e.preventDefault(); act(); }, { passive: false });

  var last = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    if (!last) last = now;
    var dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;
    if (dt < 0) dt = 0;
    update(dt);
    render();
  }

  window.addEventListener('resize', function () { resize(); initStars(); });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden && S.state === 'playing') togglePause();
  });
  window.addEventListener('blur', function () {
    if (S.state === 'playing') togglePause();
  });

  var langBtn = document.getElementById('lang');
  langBtn.textContent = LANG === 'zh' ? 'EN' : '中文';
  langBtn.onclick = function () {
    LANG = LANG === 'zh' ? 'en' : 'zh';
    try { localStorage.setItem('twinrailLang', LANG); } catch (e) { }
    langBtn.textContent = LANG === 'zh' ? 'EN' : '中文';
    if (S.state === 'menu') showMenu();
    else if (S.state === 'dead' && ov.classList.contains('show')) showOver();
    render();
  };

  resize();
  initStars();
  showMenu();
  requestAnimationFrame(frame);

  if (window.__TR_TEST) {
    window.__TR = {
      S: S, reset: reset, update: update, switchLane: switchLane,
      genChunk: genChunk, ensureWorld: ensureWorld, kill: kill,
      laneY: laneY, playerY: playerY, t: t, rankOf: rankOf, mixHex: mixHex,
      bgmStart: bgmStart, bgmStop: bgmStop, BGM: BGM, initAudio: initAudio,
      LOW: function () { return LOW; }, HIGH: function () { return HIGH; }, PX: PX, PH: PH
    };
  }
})();
</script>
</body>
</html>
