<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#0b0a0f" />
<title>骰子地牢 · DICE DELVE</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{
    margin:0;height:100%;overflow:hidden;background:#0b0a0f;color:#e8dfd2;
    font-family:"PingFang SC","Microsoft YaHei",-apple-system,"Segoe UI",system-ui,sans-serif;
    -webkit-user-select:none;user-select:none;overscroll-behavior:none;
  }
  #app{
    position:fixed;inset:0;display:flex;flex-direction:column;
    padding:14px 16px 12px;gap:10px;
    background:radial-gradient(ellipse at 50% 0%,#1a1420 0%,#0b0a0f 55%);
  }
  /* ---------- 顶栏 ---------- */
  #top{display:flex;align-items:center;gap:14px;flex:0 0 auto}
  #floor{font-size:11px;letter-spacing:.22em;color:#8a7f6d;white-space:nowrap}
  #hpwrap{flex:1;max-width:260px}
  .bar{height:10px;border-radius:5px;background:rgba(255,255,255,.07);overflow:hidden;position:relative}
  .bar i{display:block;height:100%;transition:width .25s ease}
  #hpbar i{background:linear-gradient(90deg,#e0554d,#f08a5d)}
  #hptxt{font-size:10px;color:#a99a85;margin-top:3px;letter-spacing:.1em}
  #chargeWrap{width:120px}
  #chgbar i{background:linear-gradient(90deg,#6a5cff,#9d8bff)}
  #chgtxt{font-size:10px;color:#8a7f9d;margin-top:3px;letter-spacing:.1em}

  /* ---------- 敌人 ---------- */
  #stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0;overflow:hidden}
  #floats{position:absolute;inset:0;pointer-events:none}
  #enemy{
    width:min(420px,92vw);border-radius:16px;padding:18px 20px 16px;
    background:linear-gradient(180deg,#1d1626,#141019);
    border:1px solid rgba(200,170,255,.14);
    box-shadow:0 24px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.05);
    transition:transform .12s;
  }
  @keyframes ehit{
    0%{transform:translateX(0) scale(1);filter:brightness(1)}
    15%{transform:translateX(-7px) scale(.985);filter:brightness(1.5)}
    40%{transform:translateX(6px) scale(1.01);filter:brightness(1.15)}
    65%{transform:translateX(-3px) scale(1);filter:brightness(1)}
    100%{transform:translateX(0) scale(1);filter:brightness(1)}
  }
  #enemy.hit{animation:ehit .24s ease-out}
  #enemy.dead{opacity:.25;transform:scale(.96)}
  #mobwrap{height:112px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:2px}
  #mob{width:220px;height:150px;display:block;filter:drop-shadow(0 10px 18px rgba(0,0,0,.5))}
  #ename{font-size:17px;font-weight:800;letter-spacing:.08em;color:#f0e6ff;margin-top:2px}
  @keyframes floatUp{
    0%{opacity:0;transform:translate(-50%,6px) scale(.85)}
    18%{opacity:1;transform:translate(-50%,0) scale(1.08)}
    100%{opacity:0;transform:translate(-50%,-46px) scale(1)}
  }
  .float{
    position:absolute;left:50%;top:34%;font-weight:900;font-size:26px;pointer-events:none;
    animation:floatUp .95s ease-out forwards;letter-spacing:0;
    text-shadow:0 2px 12px rgba(0,0,0,.8);
  }
  .float.dmg{color:#ff9d6b}
  .float.big{font-size:38px;color:#fff0d0;text-shadow:0 0 18px rgba(255,160,90,.9),0 2px 12px rgba(0,0,0,.8)}
  .float.hurt{color:#ff5d6c;top:9%;font-size:22px}
  @keyframes shakeX{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-7px)}
    45%{transform:translateX(6px)}
    70%{transform:translateX(-3px)}
  }
  #app.shake{animation:shakeX .22s ease-out}
  #ehp{font-size:11px;color:#9a8fb0;margin-top:6px;letter-spacing:.1em}
  #ehpbar i{background:linear-gradient(90deg,#8a5cff,#c86bff)}
  #intent{
    margin-top:16px;display:flex;align-items:center;gap:10px;
    padding:10px 14px;border-radius:10px;background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.06);
  }
  #intent .ico{font-size:20px;line-height:1}
  #intent .txt{font-size:12px;letter-spacing:.06em;color:#c9bcd8}
  #intent .txt b{color:#ffd08a;font-size:15px}
  #intent .cue{
    margin-top:5px;font-size:11px;color:#7d7288;letter-spacing:.04em;
    border-top:1px solid rgba(255,255,255,.07);padding-top:5px;
  }
  #intent .cue b{font-size:13px;letter-spacing:0}
  #intent .cue b.ok{color:#7bf0b0}
  #intent .cue b.bad{color:#ff6b78}
  #eblock{
    position:absolute;right:18px;top:16px;font-size:12px;color:#7fd3ff;
    background:rgba(80,180,255,.12);border:1px solid rgba(80,180,255,.3);
    padding:3px 8px;border-radius:20px;opacity:0;transition:opacity .2s;
  }
  #eblock.on{opacity:1}

  /* ---------- 骰子 ---------- */
  #dice{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;flex:0 0 auto;min-height:56px}
  .die{
    width:46px;height:46px;border-radius:11px;background:linear-gradient(160deg,#f6efe4,#d8cdbd);
    box-shadow:0 4px 0 #9c9284,0 8px 16px rgba(0,0,0,.45);
    display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
    padding:7px;cursor:pointer;transition:transform .1s,box-shadow .1s,opacity .15s;
    position:relative;
  }
  .die:active{transform:translateY(2px);box-shadow:0 2px 0 #9c9284}
  .die.sel{transform:translateY(-4px);box-shadow:0 4px 0 #c9a24a,0 0 0 3px rgba(255,200,90,.7),0 10px 20px rgba(0,0,0,.5)}
  .die.used{opacity:0;pointer-events:none}
  .die i{width:7px;height:7px;border-radius:50%;background:#2b2531;align-self:center;justify-self:center;opacity:0}
  .die i.on{opacity:1}
  .die.small{width:34px;height:34px;padding:5px}
  .die.small i{width:5px;height:5px}

  /* ---------- 投放区 ---------- */
  #zones{display:flex;gap:10px;flex:0 0 auto}
  .zone{
    flex:1;border-radius:14px;padding:10px 12px;min-height:74px;cursor:pointer;
    background:rgba(255,255,255,.03);border:1.5px dashed rgba(255,255,255,.14);
    transition:border-color .15s,background .15s,transform .1s;
  }
  .zone.hot{border-color:rgba(255,210,120,.85);background:rgba(255,210,120,.07);transform:translateY(-2px)}
  .zone .zh{display:flex;align-items:baseline;gap:6px;font-size:11px;letter-spacing:.16em;color:#9a8fa8}
  .zone .zv{margin-left:auto;font-size:17px;font-weight:800;color:#fff;letter-spacing:0}
  .zone .zd{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap;min-height:34px;align-items:center}
  .zone .empty{font-size:10px;color:#4d4658;letter-spacing:.1em}
  .zone.atk{border-color:rgba(255,120,90,.28)}
  .zone.def{border-color:rgba(120,200,255,.28)}
  .zone.chg{border-color:rgba(160,130,255,.28)}

  /* ---------- 底栏 ---------- */
  #bottom{display:flex;gap:10px;align-items:center;flex:0 0 auto}
  #btnEnd{
    flex:1;padding:15px;border-radius:12px;border:0;cursor:pointer;font-family:inherit;
    font-size:14px;font-weight:800;letter-spacing:.3em;text-indent:.3em;color:#1a1206;
    background:linear-gradient(100deg,#ffd08a,#ff9d5c);
    box-shadow:0 6px 24px rgba(255,160,90,.3);transition:transform .1s,opacity .2s;
  }
  #btnReroll{
    flex:0 0 96px;padding:15px 0;border-radius:12px;cursor:pointer;font-family:inherit;
    font-size:12px;font-weight:800;letter-spacing:.2em;text-indent:.2em;color:#e6dcff;
    background:rgba(140,120,255,.14);border:1px solid rgba(140,120,255,.4);
    transition:transform .1s,opacity .2s;
  }
  #btnReroll:active{transform:translateY(2px)}
  #btnReroll:disabled{opacity:.28;cursor:default}
  #btnEnd:active{transform:translateY(2px)}
  #btnEnd:disabled{opacity:.35;box-shadow:none;cursor:default}
  #logline{font-size:11px;color:#8a7f95;letter-spacing:.1em;height:16px;flex:0 0 auto;text-align:center}

  /* ---------- 覆盖层 ---------- */
  #ov{
    position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 40%,rgba(20,14,26,.82),rgba(6,5,9,.96));
    opacity:0;visibility:hidden;pointer-events:none;transition:opacity .3s,visibility 0s .3s;padding:20px;
  }
  #ov.show{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .3s,visibility 0s 0s}
  #panel{width:100%;max-width:420px;text-align:center}
  #panel h1{margin:0 0 8px;font-size:30px;letter-spacing:.2em;font-weight:800;color:#ffe6bd}
  #panel h2{margin:0 0 10px;font-size:22px;letter-spacing:.14em;color:#ffd08a}
  #panel p{font-size:12.5px;line-height:2;color:#9d92a8;margin:0 0 18px}
  .btn.alt{
    background:rgba(255,255,255,.06);color:#cfc2e0;border:1px solid rgba(200,170,255,.28);
    box-shadow:none;font-size:12px;padding:11px 30px;
  }
  .btn{
    display:inline-block;padding:13px 38px;border-radius:12px;border:0;cursor:pointer;font-family:inherit;
    font-size:13px;font-weight:800;letter-spacing:.26em;text-indent:.26em;color:#1a1206;
    background:linear-gradient(100deg,#ffd08a,#ff9d5c);box-shadow:0 6px 26px rgba(255,160,90,.35);
  }
  .cards{display:flex;flex-direction:column;gap:10px;margin:0 0 18px}
  .card{
    text-align:left;padding:14px 16px;border-radius:12px;cursor:pointer;font-family:inherit;
    background:linear-gradient(180deg,#1e1728,#161120);border:1px solid rgba(200,170,255,.16);
    color:#e8dfd2;transition:transform .12s,border-color .15s,box-shadow .15s;
  }
  .card:hover{transform:translateY(-2px);border-color:rgba(255,208,138,.6);box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .card b{display:block;font-size:14px;color:#ffe6bd;letter-spacing:.08em;margin-bottom:4px}
  .card span{font-size:11.5px;color:#9d92a8;line-height:1.6}
  .hint{font-size:10px;letter-spacing:.16em;color:#4d4658;margin-top:16px}
  @media (max-height:680px){
    #app{padding:10px 12px 8px;gap:7px}
    #enemy{padding:13px 16px 12px}
    #intent{margin-top:10px;padding:8px 12px}
    .die{width:40px;height:40px;padding:6px}
    .die.small{width:30px;height:30px}
    .zone{min-height:64px;padding:8px 10px}
    #btnEnd{padding:12px;font-size:13px}
  }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="floor">1 - 1</div>
    <div id="hpwrap">
      <div class="bar" id="hpbar"><i style="width:100%"></i></div>
      <div id="hptxt">40 / 40</div>
    </div>
    <div id="chargeWrap">
      <div class="bar" id="chgbar"><i style="width:0%"></i></div>
      <div id="chgtxt">蓄能 0 / 15</div>
    </div>
  </div>

  <div id="stage">
    <div id="floats"></div>
    <div id="enemy">
      <div id="eblock">格挡 0</div>
      <div id="mobwrap"><canvas id="mob" width="220" height="150"></canvas></div>
      <div id="ename">敌人</div>
      <div class="bar" id="ehpbar" style="margin-top:10px"><i style="width:100%"></i></div>
      <div id="ehp">20 / 20</div>
      <div id="intent"><div class="ico">⚔</div><div class="txt">意图</div></div>
    </div>
  </div>

  <div id="dice"></div>

  <div id="zones">
    <div class="zone atk" data-z="atk">
      <div class="zh">⚔ 攻击<span class="zv" id="zvAtk">0</span></div>
      <div class="zd" id="zdAtk"><span class="empty">点骰子 → 点这里</span></div>
    </div>
    <div class="zone def" data-z="def">
      <div class="zh">🛡 护盾<span class="zv" id="zvDef">0</span></div>
      <div class="zd" id="zdDef"><span class="empty">挡住这一击</span></div>
    </div>
    <div class="zone chg" data-z="chg">
      <div class="zh">✦ 蓄能<span class="zv" id="zvChg">0</span></div>
      <div class="zd" id="zdChg"><span class="empty">攒满 15 自动爆发</span></div>
    </div>
  </div>

  <div id="logline"></div>
  <div id="bottom">
    <button id="btnReroll">重 掷</button>
    <button id="btnEnd">结 束 回 合</button>
  </div>
</div>

<div id="ov" class="show"><div id="panel"></div></div>

<script>
(function () {
  'use strict';

  /* ================================================================== *
   *  骰子地牢 · DICE DELVE
   *  回合制骰子分配 Roguelike：把每回合的 5 颗骰子分配到攻击/护盾/蓄能，
   *  读敌人的意图，在七场战斗里活下去。
   * ================================================================== */

  var CFG = { chargeMax: 15, burstDmg: 22, burstBlock: 12 };

  /* ---------------------------- 数据 ---------------------------- */

  var ENEMIES = {
    rat: { sigil: '🐀', name: '通道鼠', hp: 22, moves: [{ t: 'atk', v: 8 }, { t: 'atk', v: 11 }] },
    guard: { sigil: '🛡️', name: '锈甲兵', hp: 32, moves: [{ t: 'block', v: 8 }, { t: 'atk', v: 12 }] },
    spider: { sigil: '🕷️', name: '毒囊蛛', hp: 26, moves: [{ t: 'atk', v: 6 }, { t: 'poison', v: 4 }] },
    hound: { sigil: '🐺', name: '猎犬', hp: 24, moves: [{ t: 'atk', v: 12 }, { t: 'atk', v: 8 }] },
    wall: { sigil: '🧱', name: '石墙', hp: 46, moves: [{ t: 'block', v: 14 }, { t: 'atk', v: 9 }] },
    brute: { sigil: '🗿', name: '石拳', hp: 44, moves: [{ t: 'atk', v: 15 }, { t: 'pierce', v: 8 }], elite: true },
    boss: { sigil: '💜', name: '地牢之心', hp: 80, moves: [{ t: 'atk', v: 13 }, { t: 'block', v: 10 }, { t: 'pierce', v: 10 }], boss: true }
  };

  var POOL = [
    ['rat', 'guard'],
    ['rat', 'guard', 'hound'],
    ['guard', 'hound', 'spider', 'wall'],
    ['spider', 'wall', 'hound', 'brute']
  ];

  function makeFloors(rng) {
    var fl = [];
    for (var f = 0; f < 4; f++) {
      var n = 2;
      var list = [];
      for (var i = 0; i < n; i++) {
        var pool = POOL[Math.min(f, POOL.length - 1)];
        var pick = pool[Math.floor(rng() * pool.length)];
        var tries = 0;
        while (list.indexOf(pick) >= 0 && tries++ < 8) {
          pick = pool[Math.floor(rng() * pool.length)];
        }
        list.push(pick);
      }
      fl.push(list);
    }
    fl.push(['boss']);
    return fl;
  }

  var REWARDS = [
    { id: 'hp', name: '强健体魄', desc: '最大生命 +12，并回复 12' },
    { id: 'die', name: '多一枚骰子', desc: '每回合多掷 1 颗（最多 7 颗）' },
    { id: 'atk', name: '磨刃', desc: '攻击时额外 +2 伤害' },
    { id: 'def', name: '厚甲', desc: '护盾时额外 +3 格挡' },
    { id: 'chg', name: '聚能', desc: '蓄能时额外 +2，爆发伤害 +6' },
    { id: 'heal', name: '干粮', desc: '立即回复 20，并 +5 最大生命' },
    { id: 'thorn', name: '荆棘护甲', desc: '每次受伤，对敌人反弹 5 点伤害' },
    { id: 'gstart', name: '起手之势', desc: '每回合开始获得 5 点格挡' },
    { id: 'combo', name: '连击', desc: '攻击区放 3 颗以上骰子时，额外 +7 伤害' },
    { id: 'focus', name: '聚焦', desc: '蓄能需求 -3，爆发来得更快' }
  ];

  /* ---------------------------- 状态 ---------------------------- */

  var R = null;

  var SAVE_KEY = 'diceDelve.v1';

  function saveRun() {
    try {
      if (!R || R.phase === 'dead' || R.phase === 'win') return;
      var o = {};
      for (var k in R) if (k !== 'rng') o[k] = R[k];
      o.bgm = BGM.on ? 1 : 0;
      localStorage.setItem(SAVE_KEY, JSON.stringify(o));
    } catch (e) { }
  }

  function loadRun() {
    try {
      var raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      var o = JSON.parse(raw);
      if (!o || !o.enemy || !o.floors || o.phase === 'dead' || o.phase === 'win') return null;
      return o;
    } catch (e) { return null; }
  }

  function clearSave() {
    try { localStorage.removeItem(SAVE_KEY); } catch (e) { }
  }

  function newRun(seed) {
    R = {
      hp: 45, maxHp: 45, gold: 0,
      dice: [], pool: [], assign: { atk: [], def: [], chg: [] },
      block: 0, charge: 0, poison: 0,
      atkBonus: 0, defBonus: 0, chgBonus: 0, burstBonus: 0,
      thorns: 0, startBlock: 0, comboBonus: 0, chargeCut: 0,
      dieCount: 5,
      floor: 0, enc: 0, floors: null, rerolled: false,
      enemy: null,
      phase: 'roll',
      relics: [],
      rng: seed === undefined ? Math.random : mulberry32(seed),
      log: ''
    };
    R.floors = makeFloors(R.rng);
    startFight();
    return R;
  }

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function ri(rng, n) { return Math.floor(rng() * n); }

  function startFight() {
    var id = R.floors[R.floor][R.enc];
    var base = ENEMIES[id];
    var scale = 1 + R.floor * 0.16;
    var e = {
      id: id, name: base.name, sigil: base.sigil || '❖',
      hp: Math.round(base.hp * scale),
      maxHp: Math.round(base.hp * scale),
      dmgBonus: R.floor * 1,
      moves: base.moves, mi: 0,
      block: 0, pow: 0,
      elite: !!base.elite, boss: !!base.boss
    };
    e.mi = ri(R.rng, e.moves.length);
    R.enemy = e;
    R.block = 0; R.charge = 0; R.poison = 0;
    R.rerolled = false;
    R.pool = [];
    R.sel = -1;
    R.rerolled = false;
    R.assign = { atk: [], def: [], chg: [] };
    rollDice();
    R.phase = 'assign';
    log(e.boss ? '地牢之心苏醒了。' : '一个' + e.name + '挡住了去路。');
    saveRun();
  }

  function rollDice() {
    R.dice = [];
    for (var i = 0; i < R.dieCount; i++) R.dice.push(1 + ri(R.rng, 6));
  }

  function intentOf(e) { return e.moves[e.mi % e.moves.length]; }

  function intentText(e) {
    var m = intentOf(e);
    if (m.t === 'atk') return { ico: '⚔', txt: '将要攻击 <b>' + (m.v + e.pow + e.dmgBonus) + '</b>' };
    if (m.t === 'block') return { ico: '🛡', txt: '将要获得 <b>' + m.v + '</b> 格挡' };
    if (m.t === 'buff') return { ico: '⬆', txt: '将要强化攻击 <b>+' + m.v + '</b>' };
    if (m.t === 'poison') return { ico: '☠', txt: '将要施加 <b>' + m.v + '</b> 中毒' };
    if (m.t === 'pierce') return { ico: '🩸', txt: '将要穿透 <b>' + (m.v + e.pow + e.dmgBonus) + '</b>（无视格挡）' };
    return { ico: '?', txt: '未知' };
  }

  /* ---------------------------- 核心结算 ---------------------------- */

  function sumOf(idx, dice) {
    var s = 0;
    for (var i = 0; i < idx.length; i++) s += dice[idx[i]];
    return s;
  }

  function dealToEnemy(n) {
    var e = R.enemy;
    if (n > 0) hitEnemyFx(n);
    if (e.block > 0) {
      var absorbed = Math.min(e.block, n);
      e.block -= absorbed;
      n -= absorbed;
    }
    e.hp = Math.max(0, e.hp - n);
    return n;
  }

  function resolveTurn() {
    if (R.phase !== 'assign') return;
    R.phase = 'resolve';

    var atk = sumOf(R.assign.atk, R.dice) + (R.assign.atk.length ? R.atkBonus : 0);
    if (R.comboBonus && R.assign.atk.length >= 3) atk += R.comboBonus;
    var def = sumOf(R.assign.def, R.dice) + (R.assign.def.length ? R.defBonus : 0);
    var chg = sumOf(R.assign.chg, R.dice) + (R.assign.chg.length ? R.chgBonus : 0);

    var parts = [];
    if (atk > 0) {
      var dealt = dealToEnemy(atk);
      parts.push('造成 ' + dealt + ' 伤害');
      floatText('-' + dealt, dealt >= 15 ? 'dmg big' : 'dmg');
    }
    if (def > 0) { R.block += def; parts.push('获得 ' + def + ' 格挡'); }
    if (chg > 0) {
      R.charge += chg;
      parts.push('蓄能 +' + chg);
    }
    var cmax = Math.max(6, CFG.chargeMax - (R.chargeCut || 0));
    if (R.charge >= cmax) {
      R.charge -= cmax;
      var burst = CFG.burstDmg + R.burstBonus;
      dealToEnemy(burst);
      R.block += CFG.burstBlock;
      parts.push('⚡ 爆发 ' + burst + ' 伤害 +' + CFG.burstBlock + ' 格挡');
    }
    log(parts.length ? parts.join(' · ') : '这一回合你什么也没做。');

    if (R.enemy.hp <= 0) { winFight(); return; }

    /* 敌人行动 */
    var e = R.enemy;
    var m = intentOf(e);
    FX.lunge = 0.36;
    e.block = 0;
    var eLog = '';
    if (m.t === 'atk') {
      var dmg = m.v + e.pow + e.dmgBonus;
      var taken = Math.max(0, dmg - R.block);
      R.block = Math.max(0, R.block - dmg);
      if (taken > 0) {
        R.hp -= taken;
        eLog = e.name + ' 造成 ' + taken + ' 伤害';
        floatText('-' + taken, 'hurt'); shake();
        if (R.thorns) {
          dealToEnemy(R.thorns);
          floatText('-' + R.thorns, 'dmg');
          if (R.enemy.hp <= 0) { winFight(); return; }
        }
      }
      else eLog = '你完全挡下了这一击';
    } else if (m.t === 'block') {
      e.block += m.v;
      eLog = e.name + ' 获得 ' + m.v + ' 格挡';
    } else if (m.t === 'buff') {
      e.pow += m.v;
      eLog = e.name + ' 攻击力 +' + m.v;
    } else if (m.t === 'poison') {
      R.poison += m.v;
      eLog = '你中毒了（' + m.v + ' 层）';
    } else if (m.t === 'pierce') {
      var pd = m.v + e.pow + e.dmgBonus;
      R.hp -= pd;
      floatText('-' + pd, 'hurt'); shake();
      eLog = e.name + ' 穿透造成 ' + pd + ' 伤害（无视格挡）';
    }
    e.mi++;
    log(eLog);

    if (R.poison > 0 && R.hp > 0) {
      R.hp -= R.poison;
      log('中毒造成 ' + R.poison + ' 伤害');
      R.poison--;
    }

    if (R.hp <= 0) { R.hp = 0; die(); return; }

    nextTurn();
  }

  function nextTurn() {
    R.sel = -1;
    R.block = R.startBlock || 0;
    R.assign = { atk: [], def: [], chg: [] };
    R.pool = [];
    rollDice();
    R.enemy.mi = R.enemy.mi; /* 意图已经是下一个 */
    R.rerolled = false;
    R.phase = 'assign';
    render();
    saveRun();
  }

  function winFight() {
    R.phase = 'reward';
    render();
    offerRewards();
  }

  function die() {
    R.phase = 'dead';
    clearSave();
    render();
    showPanel(
      '<h1>倒 下 了</h1>' +
      '<p>你走到了第 ' + (R.floor + 1) + ' 层第 ' + (R.enc + 1) + ' 场。<br>' +
      '蓄能 ' + R.charge + ' · 生命 ' + Math.max(0, R.hp) + '</p>' +
      '<button class="btn" id="btnRestart">再 来 一 次</button>',
      function () { document.getElementById('btnRestart').onclick = function () { newRun(); hidePanel(); render(); }; }
    );
  }

  function advance() {
    R.enc++;
    if (R.enc >= R.floors[R.floor].length) {
      R.enc = 0;
      R.floor++;
    }
    if (R.floor >= R.floors.length) { victory(); return; }
    startFight();
    render();
  }

  function victory() {
    R.phase = 'win';
    clearSave();
    showPanel(
      '<h1>通 关</h1>' +
      '<p>地牢之心停止了跳动。<br>剩余生命 ' + R.hp + ' / ' + R.maxHp + '</p>' +
      '<button class="btn" id="btnAgain">再 来 一 次</button>',
      function () { document.getElementById('btnAgain').onclick = function () { newRun(); hidePanel(); render(); }; }
    );
  }

  /* ---------------------------- 奖励 ---------------------------- */

  function offerRewards() {
    var picks = [], pool = REWARDS.slice();
    for (var i = 0; i < 3 && pool.length; i++) {
      var k = ri(R.rng, pool.length);
      picks.push(pool.splice(k, 1)[0]);
    }
    var html = '<h2>战 利 品</h2><div class="cards">';
    for (var j = 0; j < picks.length; j++) {
      html += '<button class="card" data-id="' + picks[j].id + '"><b>' + picks[j].name + '</b><span>' + picks[j].desc + '</span></button>';
    }
    html += '</div>';
    showPanel(html, function () {
      var els = document.querySelectorAll('.card');
      for (var q = 0; q < els.length; q++) {
        els[q].onclick = (function (id) {
          return function () { takeReward(id); hidePanel(); advance(); };
        })(els[q].getAttribute('data-id'));
      }
    });
  }

  function takeReward(id) {
    if (id === 'hp') { R.maxHp += 12; R.hp = Math.min(R.maxHp, R.hp + 12); }
    else if (id === 'die') { R.dieCount = Math.min(7, R.dieCount + 1); }
    else if (id === 'atk') { R.atkBonus += 2; }
    else if (id === 'def') { R.defBonus += 3; }
    else if (id === 'chg') { R.chgBonus += 2; R.burstBonus += 6; }
    else if (id === 'heal') { R.maxHp += 5; R.hp = Math.min(R.maxHp, R.hp + 20); }
    else if (id === 'thorn') { R.thorns = (R.thorns || 0) + 5; }
    else if (id === 'gstart') { R.startBlock = (R.startBlock || 0) + 5; }
    else if (id === 'combo') { R.comboBonus = (R.comboBonus || 0) + 7; }
    else if (id === 'focus') { R.chargeCut = (R.chargeCut || 0) + 3; }
    R.relics.push(id);
    saveRun();
  }

  /* ---------------------------- 渲染 ---------------------------- */

  var $ = function (id) { return document.getElementById(id); };

  function pips(v) {
    var map = { 1: [5], 2: [1, 9], 3: [1, 5, 9], 4: [1, 3, 7, 9], 5: [1, 3, 5, 7, 9], 6: [1, 3, 4, 6, 7, 9] };
    var on = map[v] || [];
    var out = '';
    for (var i = 1; i <= 9; i++) out += '<i class="' + (on.indexOf(i) >= 0 ? 'on' : '') + '"></i>';
    return out;
  }

  function dieEl(v, cls) {
    var d = document.createElement('div');
    d.className = 'die ' + (cls || '');
    d.innerHTML = pips(v);
    return d;
  }

  function render() {
    if (!R || !R.enemy) return;
    var e = R.enemy;

    $('floor').textContent = (R.floor + 1) + ' - ' + (R.enc + 1) + ' / ' + R.floors[R.floor].length;
    $('hpbar').firstElementChild.style.width = Math.max(0, R.hp / R.maxHp * 100) + '%';
    $('hptxt').textContent = Math.max(0, R.hp) + ' / ' + R.maxHp + (R.poison > 0 ? '  ☠' + R.poison : '');
    var cmax0 = Math.max(6, CFG.chargeMax - (R.chargeCut || 0));
    $('chgbar').firstElementChild.style.width = Math.min(100, R.charge / cmax0 * 100) + '%';
    $('chgtxt').textContent = '蓄能 ' + R.charge + ' / ' + cmax0;

    $('ename').textContent = e.name + (e.elite ? ' · 精英' : '') + (e.boss ? ' · BOSS' : '');
    $('ehpbar').firstElementChild.style.width = Math.max(0, e.hp / e.maxHp * 100) + '%';
    $('ehp').textContent = e.hp + ' / ' + e.maxHp;
    var it = intentText(e);
    var m0 = intentOf(e);
    var inc = 0, pier = 0;
    if (m0.t === 'atk') inc = m0.v + e.pow + e.dmgBonus;
    else if (m0.t === 'pierce') pier = m0.v + e.pow + e.dmgBonus;
    var pendDef = sumOf(R.assign.def, R.dice) + (R.assign.def.length ? R.defBonus : 0);
    var pendAtk = sumOf(R.assign.atk, R.dice) + (R.assign.atk.length ? R.atkBonus : 0);
    if (R.comboBonus && R.assign.atk.length >= 3) pendAtk += R.comboBonus;
    var through = Math.max(0, inc - (R.block + pendDef)) + pier;
    var cue = '';
    if (R.phase === 'assign') {
      cue = '<div class="cue">预计 造成 <b class="ok">' + pendAtk + '</b> · 受到 <b class="' +
            (through > 0 ? 'bad' : 'ok') + '">' + through + '</b></div>';
    }
    $('intent').innerHTML = '<div class="ico">' + it.ico + '</div><div class="txt">' + it.txt + cue + '</div>';
    var eb = $('eblock');
    eb.textContent = '格挡 ' + e.block;
    eb.className = e.block > 0 ? 'on' : '';

    /* 骰子池 */
    var pool = $('dice');
    pool.innerHTML = '';
    for (var i = 0; i < R.dice.length; i++) {
      if (R.assign.atk.indexOf(i) >= 0 || R.assign.def.indexOf(i) >= 0 || R.assign.chg.indexOf(i) >= 0) continue;
      var d = dieEl(R.dice[i], R.sel === i ? 'sel' : '');
      d.setAttribute('data-i', i);
      d.onclick = (function (idx) { return function () { pickDie(idx); }; })(i);
      pool.appendChild(d);
    }

    /* 三个区 */
    zoneRender('atk', 'zdAtk', 'zvAtk');
    zoneRender('def', 'zdDef', 'zvDef');
    zoneRender('chg', 'zdChg', 'zvChg');

    $('btnEnd').disabled = R.phase !== 'assign';
    $('btnReroll').disabled = R.phase !== 'assign' || R.rerolled;
    var tz = 0;
    if (R.hp / R.maxHp < 0.35) tz += 0.55;
    if (R.enemy.boss) tz += 0.3;
    if (R.enemy.hp < R.enemy.maxHp * 0.3) tz += 0.25;
    TENSION = Math.min(1, tz);

    $('logline').textContent = R.log || '';
    $('enemy').className = R.phase === 'reward' ? 'dead' : '';
  }

  function zoneRender(key, boxId, valId) {
    var box = $(boxId), val = $(valId);
    box.innerHTML = '';
    var list = R.assign[key];
    var total = sumOf(list, R.dice);
    var bonus = key === 'atk' ? R.atkBonus : key === 'def' ? R.defBonus : R.chgBonus;
    total += list.length ? bonus : 0;
    val.textContent = total > 0 ? total : 0;
    if (!list.length) {
      box.innerHTML = '<span class="empty">' + (key === 'atk' ? '点骰子 → 点这里' : key === 'def' ? '挡住这一击' : '攒满 ' + CFG.chargeMax + ' 自动爆发') + '</span>';
      return;
    }
    for (var i = 0; i < list.length; i++) {
      var idx = list[i];
      var d = dieEl(R.dice[idx], 'small');
      d.onclick = (function (ii) { return function (ev) { ev.stopPropagation(); unassign(ii); }; })(idx);
      box.appendChild(d);
    }
  }

  function pickDie(idx) {
    if (R.phase !== 'assign') return;
    R.sel = (R.sel === idx) ? -1 : idx;
    render();
  }

  function assignTo(zone) {
    if (R.phase !== 'assign' || R.sel === undefined || R.sel < 0) return;
    var idx = R.sel;
    R.assign.atk = R.assign.atk.filter(function (x) { return x !== idx; });
    R.assign.def = R.assign.def.filter(function (x) { return x !== idx; });
    R.assign.chg = R.assign.chg.filter(function (x) { return x !== idx; });
    R.assign[zone].push(idx);
    R.sel = -1;
    sfx(zone === 'atk' ? 210 : zone === 'def' ? 320 : 420);
    render();
  }

  function unassign(idx) {
    R.assign.atk = R.assign.atk.filter(function (x) { return x !== idx; });
    R.assign.def = R.assign.def.filter(function (x) { return x !== idx; });
    R.assign.chg = R.assign.chg.filter(function (x) { return x !== idx; });
    render();
  }

  /* ---------------------------- 覆盖层 ---------------------------- */

  function showPanel(html, bind) {
    $('panel').innerHTML = html;
    $('ov').classList.add('show');
    if (bind) bind();
  }
  function hidePanel() { $('ov').classList.remove('show'); }

  /* ---------------------------- 音效 ---------------------------- */

  var AC = null, MASTER = null, MUSIC = null, NOISE = null;
  function initAudio() {
    if (AC) return;
    var C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    AC = new C();
    MASTER = AC.createGain();
    MASTER.gain.value = 0.52;
    var comp = AC.createDynamicsCompressor();
    comp.threshold.value = -14;
    comp.knee.value = 24;
    comp.ratio.value = 5;
    comp.attack.value = 0.004;
    comp.release.value = 0.22;
    MASTER.connect(comp);
    comp.connect(AC.destination);
    MUSIC = AC.createGain();
    MUSIC.gain.value = 0.0;
    MUSIC.connect(MASTER);
    NOISE = AC.createBuffer(1, Math.floor(AC.sampleRate * 2), AC.sampleRate);
    var nd = NOISE.getChannelData(0);
    for (var ni = 0; ni < nd.length; ni++) nd[ni] = Math.random() * 2 - 1;
  }

  var BGM = { on: true, timer: null, next: 0, step: 0 };
  var SCALE = [0, 3, 5, 7, 10];

  function bgmStart() {
    if (!AC || BGM.timer || !BGM.on) return;
    MUSIC.gain.setTargetAtTime(1.65, AC.currentTime, 0.6);
    BGM.next = AC.currentTime + 0.15;
    BGM.step = 0;
    BGM.timer = setInterval(bgmTick, 60);
  }

  function bgmStop() {
    if (BGM.timer) { clearInterval(BGM.timer); BGM.timer = null; }
    if (MUSIC && AC) MUSIC.gain.setTargetAtTime(0.0, AC.currentTime, 0.3);
  }

  function bgmTick() {
    if (!AC || !BGM.on) return;
    var ahead = AC.currentTime + 0.25;
    while (BGM.next < ahead) {
      bgmStep(BGM.step, BGM.next);
      BGM.next += 0.32;
      BGM.step++;
    }
  }

  var CHORDS = [45, 41, 48, 43];   /* Am – F – C – G */

  function bgmStep(i, t) {
    var s = i % 16;
    var bar = Math.floor(i / 16) % CHORDS.length;
    var root = CHORDS[bar];

    if (s === 0) { drone(t); pad(t, root); }
    if (s === 0 || s === 6 || s === 12) pulse(t);
    if (s === 0 || s === 6 || s === 10 || s === 14) bassNote(t, root, 0.6);
    if (s % 4 === 2) pluck(t, i, root);
    if (s % 2 === 1) shaker(t, 0.03);
    if (i % 64 === 0) bell(t);
    if (i % 128 === 96) swell(t);

    /* 紧张层：血少 / BOSS / 敌人残血时叠上来 */
    if (TENSION > 0.4) {
      if (s === 4 || s === 12) tritone(t, root);
      if (s % 4 === 0) heartbeat(t);
    }
    if (TENSION > 0.75) {
      shaker(t, 0.05);
      if (s % 8 === 7) tritone(t, root + 12);
    }
  }

  function tritone(t, root) {
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sawtooth';
    o.frequency.value = mtof(root + 6);
    var f = AC.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 520; f.Q.value = 6;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.035 * (0.4 + TENSION), t + 0.25);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 2.2);
    o.connect(f); f.connect(g); g.connect(MUSIC);
    o.start(t); o.stop(t + 2.3);
  }

  function heartbeat(t) {
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(78, t);
    o.frequency.exponentialRampToValueAtTime(38, t + 0.14);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.09 * (0.5 + TENSION), t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    o.connect(g); g.connect(MUSIC);
    o.start(t); o.stop(t + 0.2);
  }

  function mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); }

  function bassNote(t, root, dur) {
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = 'triangle';
    o.frequency.value = mtof(root - 12);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.10, t + 0.04);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(MUSIC);
    o.start(t); o.stop(t + dur + 0.05);
  }

  function pad(t, root) {
    var ivs = [0, 7, 12];
    for (var k = 0; k < ivs.length; k++) {
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sine';
      o.frequency.value = mtof(root + ivs[k]);
      o.detune.value = (k - 1) * 5;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.040, t + 1.3);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 5.2);
      o.connect(g); g.connect(MUSIC);
      o.start(t); o.stop(t + 5.4);
    }
  }

  function shaker(t, vol) {
    if (!NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 6500;
    var g = AC.createGain();
    g.gain.setValueAtTime(vol || 0.03, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
    s.connect(f); f.connect(g); g.connect(MUSIC);
    s.start(t, 0, 0.08);
  }

  function swell(t) {
    if (!NOISE) return;
    var s = AC.createBufferSource(); s.buffer = NOISE;
    var f = AC.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.setValueAtTime(400, t);
    f.frequency.exponentialRampToValueAtTime(1400, t + 3); f.Q.value = 0.8;
    var g = AC.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.045, t + 1.6);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 3);
    s.connect(f); f.connect(g); g.connect(MUSIC);
    s.start(t, 0, 3.1);
  }

  function drone(t) {
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.value = 55;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.09, t + 0.5);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 2.6);
    o.connect(g); g.connect(MUSIC);
    o.start(t); o.stop(t + 2.7);
  }

  function pulse(t) {
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(120, t);
    o.frequency.exponentialRampToValueAtTime(45, t + 0.16);
    g.gain.setValueAtTime(0.15, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    o.connect(g); g.connect(MUSIC);
    o.start(t); o.stop(t + 0.24);
  }

  function pluck(t, i, root) {
    var n = SCALE[(i * 3) % SCALE.length];
    var f = mtof(root + n) * (i % 32 < 16 ? 1 : 2);
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = 'triangle'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.05, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
    o.connect(g); g.connect(MUSIC);
    o.start(t); o.stop(t + 0.52);
  }

  function bell(t) {
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.035, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
    o.connect(g); g.connect(MUSIC);
    o.start(t); o.stop(t + 1.7);
  }
  function sfx(freq) {
    if (!AC) return;
    var t = AC.currentTime;
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.25, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    o.connect(g); g.connect(MASTER);
    o.start(t); o.stop(t + 0.14);
  }
  function sfxHit() {
    if (!AC) return;
    var t = AC.currentTime;
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(140, t);
    o.frequency.exponentialRampToValueAtTime(60, t + 0.18);
    g.gain.setValueAtTime(0.3, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    o.connect(g); g.connect(MASTER);
    o.start(t); o.stop(t + 0.22);
  }

  /* ---------------------------- 启动 ---------------------------- */

  function log(s) { R.log = s; }

  var MOBC = document.getElementById('mob');
  var MOBX = MOBC ? MOBC.getContext('2d') : null;
  var FX = { lunge: 0, hurt: 0 };
  var TENSION = 0;

  function drawMob(t) {
    if (!MOBX || !R || !R.enemy) return;
    var g = MOBX, W = 220, H = 150;
    g.clearRect(0, 0, W, H);
    var e = R.enemy;
    var bob = Math.sin(t * 1.7) * 2.5;
    var lunge = 0;
    if (FX.lunge > 0) lunge = Math.sin((1 - FX.lunge / 0.36) * Math.PI) * 24;
    g.save();
    g.translate(W / 2, H - 18 + bob + lunge);
    var hurt = FX.hurt > 0;
    if (e.id === 'rat') drawRat(g, hurt, t);
    else if (e.id === 'hound') drawHound(g, hurt, t);
    else if (e.id === 'wall') drawWall(g, hurt, t);
    else if (e.id === 'guard') drawGuard(g, hurt, t);
    else if (e.id === 'spider') drawSpider(g, hurt, t);
    else if (e.id === 'brute') drawBrute(g, hurt, t);
    else drawBoss(g, hurt, t);
    g.restore();
  }

  function drawRat(g, hurt, t) {

  function drawSpider(g, hurt, t) {

  function drawBoss(g, hurt, t) {
    var p = 1 + Math.sin(t * 2.2) * 0.05;
    g.save();
    g.scale(p, p);
    g.strokeStyle = hurt ? '#fff' : '#5b2f74';
    g.lineWidth = 4; g.lineCap = 'round';
    for (var i = 0; i < 5; i++) {
      var a = -0.9 + i * 0.45;

      g.beginPath();
      g.moveTo(0, -20);
      g.quadraticCurveTo(Math.sin(a) * 44 + sway, -44, Math.sin(a) * 62 + sway, -2);

    g.moveTo(-34, -44); g.lineTo(0, -6); g.lineTo(34, -44); g.closePath(); g.fill();

  function floatText(txt, cls) {
    var box = document.getElementById('floats');
    if (!box) return;
    var d = document.createElement('div');
    d.className = 'float ' + (cls || '');
    d.textContent = txt;
    box.appendChild(d);
    setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 960);
  }

  function hitEnemyFx(n) {
    FX.hurt = 0.24;
    var card = document.getElementById('enemy');
    if (card) {
      card.classList.remove('hit');
      void card.offsetWidth;
      card.classList.add('hit');
      setTimeout(function () { card.classList.remove('hit'); }, 240);
    }
  }

  function shake() {
    var a = document.getElementById('app');
    if (!a) return;
    a.classList.remove('shake');
    void a.offsetWidth;
    a.classList.add('shake');
    setTimeout(function () { a.classList.remove('shake'); }, 240);
  }

  function doReroll() {
    if (!R || R.phase !== 'assign' || R.rerolled) return;
    R.rerolled = true;
    R.sel = -1;
    for (var i = 0; i < R.dice.length; i++) {
      var used = R.assign.atk.indexOf(i) >= 0 || R.assign.def.indexOf(i) >= 0 || R.assign.chg.indexOf(i) >= 0;
      if (!used) R.dice[i] = 1 + ri(R.rng, 6);
    }
    sfx(520);
    render();
  }

  $('btnReroll').onclick = function () { initAudio(); doReroll(); };

  $('btnEnd').onclick = function () {
    initAudio();
    resolveTurn();
    if (R.phase === 'assign') render();
  };

  var zoneEls = document.querySelectorAll('.zone');
  for (var zi = 0; zi < zoneEls.length; zi++) {
    zoneEls[zi].onclick = (function (z) {
      return function () { assignTo(z); };
    })(zoneEls[zi].getAttribute('data-z'));
  }

  window.addEventListener('keydown', function (e) {
    if (e.key === 'm' || e.key === 'M') {
      BGM.on = !BGM.on;
      if (BGM.on) { initAudio(); bgmStart(); } else bgmStop();
      saveRun();
      return;
    }
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      if (R && R.phase === 'assign') { document.getElementById('btnEnd').click(); }
      else {
        var b = document.querySelector('#panel .btn');
        if (b) b.click();
      }
    }
  });

  function beginRun() {
    initAudio();
    bgmStart();
    hidePanel();
    newRun();
    render();
  }

  function resumeRun() {
    var o = loadRun();
    if (!o) return false;
    R = o;
    R.rng = Math.random;
    R.phase = 'assign';
    if (o.bgm) BGM.on = true;
    initAudio();
    bgmStart();
    hidePanel();
    render();
    return true;
  }

  function showIntro() {
    var sv = loadRun();
    var html = '<h1>骰 子 地 牢</h1>' +
      '<p>每回合掷 <b>5 颗骰子</b>，分配成 <b>攻击</b>、<b>护盾</b> 或 <b>蓄能</b>。<br>' +
      '敌人的下一步是公开的 —— 算好再放。<br>' +
      '蓄能满 15 会自动爆发。</p>';
    if (sv) {
      html += '<button class="btn" id="btnContinue">继 续 上 一 局</button>' +
        '<div class="hint" style="margin:10px 0 14px">第 ' + (sv.floor + 1) + ' 层 · 生命 ' + sv.hp + ' / ' + sv.maxHp + ' · 骰子 ' + sv.dieCount + '</div>' +
        '<button class="btn alt" id="btnStart">重 开 新 局</button>';
    } else {
      html += '<button class="btn" id="btnStart">进 入 地 牢</button>';
    }
    showPanel(html, function () {
      if (sv) document.getElementById('btnContinue').onclick = function () { resumeRun(); };
      document.getElementById('btnStart').onclick = function () { beginRun(); };
    });
  }

  if (window.__DD_TEST) {
    window.__DD = {
      R: function () { return R; },
      newRun: newRun, resolveTurn: resolveTurn,
      assignTo: assignTo, pickDie: pickDie,
      sumOf: sumOf, intentOf: intentOf, takeReward: takeReward,
      POOL: POOL, ENEMIES: ENEMIES, REWARDS: REWARDS, CFG: CFG,
      startFight: startFight, advance: advance, render: render, doReroll: doReroll,
      beginRun: beginRun, resumeRun: resumeRun, saveRun: saveRun, loadRun: loadRun, clearSave: clearSave,
render: render, doReroll: doReroll, makeFloors: makeFloors
    };
  }

  var lastFrame = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    var t = now / 1000;
    var dt = lastFrame ? Math.min(0.05, t - lastFrame) : 0.016;
    lastFrame = t;
    if (FX.lunge > 0) FX.lunge = Math.max(0, FX.lunge - dt);
    if (FX.hurt > 0) FX.hurt = Math.max(0, FX.hurt - dt);
    if (R && R.enemy) drawMob(t);
  }

  showIntro();
  requestAnimationFrame(frame);

  /* ---------------- i18n ---------------- */

  (function () {
    var LANG = 'zh';
    var sysEn = (navigator.language || 'zh').toLowerCase().indexOf('zh') !== 0;
    try {
      var sv = localStorage.getItem('gameLang');
      if (sv) LANG = sv;
      else if (sysEn) LANG = 'en';
    } catch (e) {
      if (sysEn) LANG = 'en';
    }

    var EXACT = {"骰 子 地 牢":"DICE DELVE","进 入 地 牢":"ENTER THE DUNGEON","继 续 上 一 局":"CONTINUE","重 开 新 局":"NEW RUN","结 束 回 合":"END TURN","重 掷":"REROLL","⚔ 攻击":"⚔ ATTACK","🛡 护盾":"🛡 BLOCK","✦ 蓄能":"✦ CHARGE","点骰子 → 点这里":"Pick a die → tap here","挡住这一击":"Block the hit","攒满 15 自动爆发":"Fills at 15, then bursts","战 利 品":"REWARDS","再 来 一 次":"PLAY AGAIN","倒 下 了":"YOU DIED","通 关":"VICTORY","敌人":"Enemy","意图":"Intent","地牢之心苏醒了。":"The dungeon heart awakens.","这一回合你什么也没做。":"You did nothing this turn.","你完全挡下了这一击":"You blocked it completely","强健体魄":"Tough Frame","多一枚骰子":"Extra Die","磨刃":"Whetstone","厚甲":"Heavy Plate","聚能":"Focus Core","干粮":"Rations","荆棘护甲":"Thorn Mail","起手之势":"Head Start","连击":"Combo","聚焦":"Focus","通道鼠":"Tunnel Rat","锈甲兵":"Rust Guard","毒囊蛛":"Venom Spider","石拳":"Stonefist","地牢之心":"Dungeon Heart","猎犬":"Hound","石墙":"Stone Wall","攻 击":"ATTACK","护 盾":"BLOCK","蓄 能":"CHARGE","骰子地牢 · DICE DELVE":"DICE DELVE"};
    var RULES = [["^第 (\\d+) 层 · 生命 (\\d+) / (\\d+) · 骰子 (\\d+)$","Floor $1 · HP $2 / $3 · dice $4"],["^第 (\\d+) 层$","Floor $1"],["^蓄能 (\\d+) / (\\d+)$","CHARGE $1 / $2"],["^格挡 (\\d+)$","Block $1"],["^预计 造成 (\\d+) · 受到 (\\d+)$","Est. deal $1 · take $2"],["^你走到了第 (\\d+) 层第 (\\d+) 场。$","You fell on floor $1, fight $2."],["^剩余生命 (\\d+) / (\\d+)$","HP left $1 / $2"]];
    var FRAGS = [["、",", "],["或","or"],["，分配成 "," into "],["预计 造成 ","Est. deal "],[" · 受到 "," · take "],["攻击力 +","attack +"],["· 骰子","· dice"],["· 精英","· ELITE"],["自动爆发","auto-burst"],["攒满 ","Fills at "],["未知","Unknown"],["层第",", fight "],["场。","."],["骰子","dice"],["一个","A "],["每回合掷","Roll"],["颗骰子"," dice"],["分配成","into"],["敌人的下一步是公开的 —— 算好再放。","Enemy intents are public — plan around them."],["蓄能满 15 会自动爆发。","Charge reaches 15 to trigger a burst."],["最大生命 +12，并回复 12","Max HP +12 and heal 12"],["每回合多掷 1 颗（最多 7 颗）","one more die per turn (max 7)"],["攻击时额外 +2 伤害","attacks deal +2"],["护盾时额外 +3 格挡","block gains +3"],["蓄能时额外 +2，爆发伤害 +6","charge +2, burst +6"],["立即回复 20，并 +5 最大生命","heal 20 and max HP +5"],["每次受伤，对敌人反弹 5 点伤害","reflect 5 damage when hurt"],["每回合开始获得 5 点格挡","start each turn with 5 block"],["攻击区放 3 颗以上骰子时，额外 +7 伤害","+7 damage when 3+ dice on attack"],["蓄能需求 -3，爆发来得更快","charge threshold -3, burst sooner"],["将要攻击","Attacks for"],["将要获得","Gains"],["将要强化攻击","Buffs attack"],["将要施加","Applies"],["将要穿透","Pierces for"],["无视格挡","ignores block"],["穿透造成","Pierce deals"],["你中毒了（","Poisoned ("],["中毒造成","Poison deals"],["挡住了去路。","blocks the way."],["造成","deal"],["伤害"," dmg"],["获得","gain"],["蓄能","charge"],["爆发","burst"],["中毒","poison"],["生命","HP"],["层","F"],["攻击","attack"],["护盾","block"],[" 格挡"," block"],["格挡","block"]];
    var RX = [];
    for (var i = 0; i < RULES.length; i++) RX.push([new RegExp(RULES[i][0]), RULES[i][1]]);
    FRAGS.sort(function (a, b) { return b[0].length - a[0].length; });

    function tf(s) {
      if (LANG !== 'en') return null;
      var t = s.trim();
      if (!t) return null;
      if (EXACT[t] !== undefined) {
        var e = EXACT[t];
        return e === t ? null : e;
      }
      for (var i = 0; i < RX.length; i++) {
        if (RX[i][0].test(t)) return t.replace(RX[i][0], RX[i][1]);
      }
      var out = s, hit = false;
      for (var j = 0; j < FRAGS.length; j++) {
        if (out.indexOf(FRAGS[j][0]) >= 0) {
          out = out.split(FRAGS[j][0]).join(FRAGS[j][1]);
          hit = true;
        }
      }
      return hit ? out : null;
    }

    var busy = false;

    function walk(n) {
      if (!n) return;
      if (n.nodeType === 3) {
        var v = tf(n.nodeValue);
        if (v !== null && v !== n.nodeValue) n.nodeValue = v;
        return;
      }
      if (n.nodeType !== 1) return;
      var tag = n.tagName;
      if (tag === 'SCRIPT' || tag === 'STYLE') return;
      if (n.getAttribute && n.getAttribute('data-i18n-skip')) return;
      if (n.title) { var tv = tf(n.title); if (tv !== null && tv !== n.title) n.title = tv; }
      if (n.placeholder) { var pv = tf(n.placeholder); if (pv !== null && pv !== n.placeholder) n.placeholder = pv; }
      var kids = n.childNodes;
      for (var i = 0; i < kids.length; i++) walk(kids[i]);
    }

    if (LANG === 'en') {
      if (document.title) {
        var dt = tf(document.title);
        if (dt !== null && dt !== document.title) document.title = dt;
      }
      walk(document.body);
      try {
        new MutationObserver(function (ms) {
          if (busy) return;
          busy = true;
          try {
            for (var i = 0; i < ms.length; i++) {
              var a = ms[i].addedNodes;
              for (var j = 0; j < a.length; j++) walk(a[j]);
              if (ms[i].type === 'characterData') walk(ms[i].target);
            }
          } finally { busy = false; }
        }).observe(document.body, { childList: true, subtree: true, characterData: true });
      } catch (e) { }
    }

    var btn = document.createElement('button');
    btn.setAttribute('data-i18n-skip', '1');
    btn.textContent = LANG === 'en' ? '中文' : 'EN';
    btn.title = LANG === 'en' ? '切换中文' : 'Switch to English';
    btn.style.cssText = 'position:fixed;right:12px;top:10px;z-index:999;' +
      'padding:5px 9px;border-radius:7px;cursor:pointer;font:700 11px/1 system-ui,sans-serif;' +
      'letter-spacing:.06em;opacity:.72;transition:opacity .2s;' +
      'color:#dfe9f2;background:rgba(16,18,26,.75);border:1px solid rgba(180,200,220,.3)';
    btn.onmouseenter = function () { btn.style.opacity = '1'; };
    btn.onmouseleave = function () { btn.style.opacity = '.72'; };
    btn.onclick = function () {
      try { localStorage.setItem('gameLang', LANG === 'en' ? 'zh' : 'en'); } catch (e) { }
      location.reload();
    };
    document.body.appendChild(btn);
  })();

})();
